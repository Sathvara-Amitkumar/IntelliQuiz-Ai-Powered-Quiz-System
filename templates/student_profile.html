<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="mb-0">My Profile</h3>
                <a href="{{ url_for('student.dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
            </div>
            <div class="card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form action="{{ url_for('student.profile') }}" method="POST">
                    <div class="row">
                        <div class="col-md-4 text-center mb-4">
                            <div class="avatar-container">
                                <span class="avatar-initial avatar-initial-medium" data-initial="{{ user.username[0] if user and user.username else 'U' }}">{{ user.username[0] if user and user.username else 'U' }}</span>
                            </div>
                        </div>
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" value="{{ user.username }}" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" value="{{ user.email }}" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="mobile" class="form-label">Mobile (Optional)</label>
                                <input type="tel" class="form-control" id="mobile" name="mobile" value="{{ profile.mobile if profile else '' }}" placeholder="Enter mobile number">
                            </div>
                            <div class="mb-3">
                                <label for="enrollment_number" class="form-label">Enrollment Number <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="enrollment_number" name="enrollment_number" value="{{ profile.enrollment_number if profile else '' }}" placeholder="11 digits" maxlength="11" pattern="[0-9]{11}" required>
                                <small class="form-text text-muted">Must be exactly 11 digits</small>
                            </div>
                            <div class="mb-3">
                                <label for="class" class="form-label">Class <span class="text-danger">*</span></label>
                                <select class="form-select" id="class" name="class" required>
                                    <option value="">-- Select Class --</option>
                                    <option value="7IT-A" {% if profile and profile.class == '7IT-A' %}selected{% endif %}>7IT-A</option>
                                    <option value="7IT-B" {% if profile and profile.class == '7IT-B' %}selected{% endif %}>7IT-B</option>
                                    <option value="7CE-A" {% if profile and profile.class == '7CE-A' %}selected{% endif %}>7CE-A</option>
                                    <option value="7CE-B" {% if profile and profile.class == '7CE-B' %}selected{% endif %}>7CE-B</option>
                                    <option value="7CE-C" {% if profile and profile.class == '7CE-C' %}selected{% endif %}>7CE-C</option>
                                    <option value="7-IOT" {% if profile and profile.class == '7-IOT' %}selected{% endif %}>7-IOT</option>
                                    <option value="7-AI" {% if profile and profile.class == '7-AI' %}selected{% endif %}>7-AI</option>
                                    <option value="7-CSBS" {% if profile and profile.class == '7-CSBS' %}selected{% endif %}>7-CSBS</option>
                                </select>
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                                <a href="{{ url_for('student.dashboard') }}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
